[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."archivar-sismos"]
  schedule = "*/30 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Service Worker: NUNCA almacenar en caché por el navegador o CDN
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Documentos HTML raíz: Revalidación inmediata
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Manifiesto de la aplicación web
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Activos estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Digital Asset Links para Android TWA
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"
    Access-Control-Allow-Origin = "*"

# Página pública de Política de Privacidad
[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 200

[[headers]]
  for = "/privacidad.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"


# Rutas API compartidas con Cloudflare Pages, sin cambiar la API de Netlify original.
[[redirects]]
  from = "/api/sismos"
  to = "/.netlify/functions/sismos"
  status = 200

[[redirects]]
  from = "/api/historico-sismos"
  to = "/.netlify/functions/historico-sismos"
  status = 200

[[redirects]]
  from = "/api/detalle-sismo"
  to = "/.netlify/functions/detalle-sismo"
  status = 200
